<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tarot">
<meta name="theme-color" content="#0f0b1e">
<title>Tarot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0b1e;
    --panel: #1d1735;
    --panel-2: #261e45;
    --line: #3a3060;
    --gold: #d8b46a;
    --gold-dim: #9c8150;
    --text: #efe7d6;
    --muted: #a79fbd;
    --rev: #e59a9a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 19px;
    line-height: 1.45;
    min-height: 100dvh;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  /* Fixed sky (background-attachment: fixed is unreliable on iOS) */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 40% 30%, #fff5 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 44%, #fff7 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 66%, #fff5 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 80%, #fff4 50%, transparent 51%),
      radial-gradient(1px 1px at 92% 90%, #fff6 50%, transparent 51%),
      radial-gradient(ellipse at 50% -10%, #3b2a6b 0%, transparent 60%),
      var(--bg);
  }
  .app {
    max-width: 760px; margin: 0 auto;
    padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px);
  }
  h1, h2, h3, .cinzel { font-family: 'Cinzel', Georgia, serif; font-weight: 500; letter-spacing: .04em; }
  h1 { text-align: center; color: var(--gold); font-size: 30px; margin: 4px 0 2px; }
  .subtitle { text-align: center; color: var(--muted); font-style: italic; margin: 0 0 18px; }

  /* Tabs */
  .tabs { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; margin: 0 auto 22px; max-width: 360px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--muted); font: 600 13px 'Cinzel', serif; letter-spacing: .06em; padding: 10px 0; border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--gold); color: #1a1430; }

  /* Form */
  .panel { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  label.h { display: block; font: 600 12px 'Cinzel', serif; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; margin: 0 0 8px; }
  textarea {
    width: 100%; resize: none; border-radius: 10px; border: 1px solid var(--line); background: #120e24; color: var(--text);
    font: italic 19px 'Cormorant Garamond', Georgia, serif; padding: 12px; min-height: 76px; outline: none;
  }
  textarea:focus { border-color: var(--gold-dim); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { border: 1px solid var(--line); background: #120e24; color: var(--text); border-radius: 999px; padding: 9px 14px; font: 17px 'Cormorant Garamond', serif; cursor: pointer; }
  .chip[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: #2a2140; }
  .chip small { color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 4px 0 18px; }
  .switch { position: relative; width: 50px; height: 30px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #120e24; border: 1px solid var(--line); border-radius: 999px; transition: .2s; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: .2s; }
  .switch input:checked + span { border-color: var(--gold); }
  .switch input:checked + span::after { transform: translateX(20px); background: var(--gold); }
  .btn {
    display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; cursor: pointer;
    background: linear-gradient(180deg, #e6c47c, #c29c55); color: #1a1430; font: 700 15px 'Cinzel', serif; letter-spacing: .1em;
  }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--gold); }
  .btn:active { transform: scale(.98); }
  .muted { color: var(--muted); }
  .center { text-align: center; }

  /* Card back artwork */
  .backart { width: 100%; height: 100%; display: block; }
  .card-back {
    background: radial-gradient(circle at 50% 50%, #3a2a6e 0%, #1c1438 70%);
    border-radius: 7cqw; overflow: hidden;
    box-shadow: 0 6px 18px #0008;
  }

  /* Deck shuffle */
  .deck-stack { position: relative; width: 120px; aspect-ratio: 7/12; margin: 30px auto; container-type: inline-size; }
  .deck-stack .card-back { position: absolute; inset: 0; }
  .deck-stack.shuffling .card-back:nth-child(1) { animation: shufA .45s ease-in-out infinite; }
  .deck-stack.shuffling .card-back:nth-child(2) { animation: shufB .45s ease-in-out infinite; }
  @keyframes shufA { 50% { transform: translateX(-50px) rotate(-8deg); } }
  @keyframes shufB { 50% { transform: translateX(50px) rotate(8deg); } }

  /* Cards */
  .question { text-align: center; font-style: italic; color: var(--muted); margin: 0 0 6px; }
  .spread-title { text-align: center; color: var(--gold); margin: 0 0 4px; font-size: 18px; }
  .hint { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 18px; }
  .spread { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 12px; --w: 104px; }
  .spread.n1 { --w: min(60vw, 230px); }
  .spread.n3 { --w: min(29vw, 160px); }
  .spread.n5 { --w: min(29vw, 136px); }
  .spread.n10 { --w: min(29vw, 124px); }
  .slot { width: var(--w); display: flex; flex-direction: column; align-items: center; gap: 4px; animation: deal .5s backwards; }
  @keyframes deal { from { opacity: 0; transform: translateY(-30px) scale(.9); } }
  .pos { font: 600 11px 'Cinzel', serif; letter-spacing: .08em; color: var(--gold); text-align: center; text-transform: uppercase; margin-top: 4px; }
  .pos .num { color: var(--muted); }
  .cname { font-size: 14px; font-style: italic; color: var(--text); text-align: center; line-height: 1.15; min-height: 1em; }
  .cname .tag-rev { font-size: 13px; }

  .card { width: var(--w); aspect-ratio: 7/12; perspective: 900px; cursor: pointer; container-type: inline-size; border: 0; padding: 0; background: none; display: block; }
  .inner { position: relative; width: 100%; height: 100%; transition: transform .75s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .card.flipped .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: 7cqw; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; box-shadow: 0 6px 18px #0008; }
  .front {
    transform: rotateY(180deg);
    background: linear-gradient(170deg, #2e2550, #191330);
    border: 1px solid var(--gold-dim);
    color: var(--c, var(--gold));
  }
  .card.rev .front { transform: rotateY(180deg) rotate(180deg); }
  .front img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .front::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 1.5cqw #0004; background: linear-gradient(125deg, #fff2 0%, transparent 35%); }
  .fallback {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 9cqw 6cqw 8cqw; text-align: center;
    box-shadow: inset 0 0 0 3.5cqw #191330, inset 0 0 0 4.3cqw var(--gold-dim);
  }
  .fallback .top { font: 700 11cqw 'Cinzel', serif; }
  .fallback .art { font-size: 38cqw; line-height: 1; }
  .fallback .art svg { width: 52cqw; height: 52cqw; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .fallback .name { font: 600 9.5cqw 'Cinzel', serif; color: var(--text); line-height: 1.15; }

  .readout { margin-top: 26px; display: grid; gap: 12px; }
  .reading-item { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; }
  .reading-item h3 { margin: 0 0 2px; font-size: 15px; color: var(--gold); }
  .reading-item .card-name { font-weight: 600; }
  .tag-rev { color: var(--rev); font-style: italic; }
  .kw { color: var(--muted); font-style: italic; }
  .summary { border-color: var(--gold-dim); cursor: default; }
  .summary p { margin: 6px 0; }
  .summary h4 { font: 600 11px 'Cinzel', serif; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; margin: 16px 0 2px; opacity: .85; }
  .summary h3 + h4 { margin-top: 8px; }
  .entry .summary { margin: 10px 0; background: #160f2c; }
  .ask { margin-top: 12px; }
  .ask .note { font-size: 16px; margin: -2px 0 10px; }
  .ask textarea { min-height: 64px; margin-bottom: 12px; }
  .ask .err { color: var(--rev); font-size: 16px; margin: 0 0 10px; }
  .btn:disabled { opacity: .6; cursor: default; }
  .answer .q { font-style: italic; color: var(--muted); margin: 2px 0 8px; }
  .answer p { margin: 8px 0; }
  /* Yükleme sahnesi: rüzgâr, yapraklar ve keşiş */
  .wind-scene svg { display: block; width: 100%; max-width: 360px; margin: 4px auto 0; overflow: hidden; }
  .wind-scene .loading-text { margin: 4px 0 2px; font-style: italic; }
  .wind-scene .gust { fill: none; stroke: var(--muted); stroke-width: 1.2; stroke-linecap: round; opacity: 0;
    animation: gust 1.9s linear infinite; }
  @keyframes gust { 0% { transform: translateX(310px); opacity: 0; } 15%, 80% { opacity: .55; } 100% { transform: translateX(-60px); opacity: 0; } }
  .wind-scene .ground { stroke: var(--gold-dim); stroke-width: 1.5; stroke-dasharray: 7 9; animation: ground .8s linear infinite; }
  @keyframes ground { to { stroke-dashoffset: 16; } }
  .wind-scene .monk { animation: bob .8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-1.5px); } }
  .wind-scene .robe { fill: #3d3168; stroke: var(--gold); stroke-width: 1; stroke-linejoin: round; }
  .wind-scene .cape { fill: #2c2350; stroke: var(--gold-dim); stroke-width: .8; transform-origin: -4px -44px; animation: flap .5s ease-in-out infinite; }
  @keyframes flap { 50% { transform: skewY(-7deg) scaleX(1.12); } }
  .wind-scene .face { fill: #120e24; }
  .wind-scene .beard { fill: none; stroke: #cfc6b8; stroke-width: 1.6; stroke-linecap: round; }
  .wind-scene .arm { fill: none; stroke: #3d3168; stroke-width: 4; stroke-linecap: round; }
  .wind-scene .foot { fill: #1a1430; }
  .wind-scene .foot-a { animation: step .8s ease-in-out infinite; }
  .wind-scene .foot-b { animation: step .8s ease-in-out infinite reverse; }
  @keyframes step { 0%, 100% { transform: translateX(-3px); } 50% { transform: translateX(3px); } }
  .wind-scene .staff { transform-origin: 22px -35px; animation: staff .8s ease-in-out infinite; }
  @keyframes staff { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .wind-scene .pole { stroke: #a8865a; stroke-width: 2; stroke-linecap: round; }
  .wind-scene .cord { stroke: var(--gold-dim); stroke-width: .8; }
  .wind-scene .lantern { fill: #f3d58a; stroke: var(--gold); stroke-width: .6; }
  .wind-scene .glow { fill: #f3d58a; opacity: .25; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { opacity: .5; } }
  .wind-scene .leaf { transform-origin: 0 0; animation: blow 3s linear infinite; }
  .wind-scene .leaf path { fill: currentColor; }
  .wind-scene .leaf .vein { fill: none; stroke: #0004; stroke-width: .6; }
  .wind-scene .l1 { color: #e7a06a; animation-duration: 2.6s; animation-delay: -.3s; }
  .wind-scene .l2 { color: var(--gold); animation-duration: 3.2s; animation-delay: -1.8s; animation-name: blow2; }
  .wind-scene .l3 { color: #c97b5a; animation-duration: 2.8s; animation-delay: -1.1s; }
  .wind-scene .l4 { color: #b9a35a; animation-duration: 3.5s; animation-delay: -2.6s; animation-name: blow2; }
  .wind-scene .l5 { color: #e7a06a; animation-duration: 2.4s; animation-delay: -.9s; animation-name: blow2; }
  .wind-scene .l6 { color: #d6c25e; animation-duration: 3s; animation-delay: -2.1s; }
  .wind-scene .l7 { color: #c97b5a; animation-duration: 3.4s; animation-delay: -.5s; }
  @keyframes blow {
    0% { transform: translate(320px, 0) rotate(0deg); }
    25% { transform: translate(240px, -10px) rotate(140deg); }
    50% { transform: translate(160px, 8px) rotate(260deg); }
    75% { transform: translate(80px, -6px) rotate(400deg); }
    100% { transform: translate(-30px, 6px) rotate(560deg); }
  }
  @keyframes blow2 {
    0% { transform: translate(320px, 0) rotate(0deg); }
    30% { transform: translate(220px, 9px) rotate(-150deg); }
    60% { transform: translate(120px, -9px) rotate(-300deg); }
    100% { transform: translate(-30px, 4px) rotate(-480deg); }
  }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .actions { display: grid; gap: 10px; margin-top: 22px; }

  /* Bottom sheet */
  .backdrop { position: fixed; inset: 0; background: #0009; opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 88dvh; overflow-y: auto;
    background: var(--panel-2); border-top: 1px solid var(--gold-dim); border-radius: 20px 20px 0 0;
    padding: 10px 20px calc(env(safe-area-inset-bottom) + 24px); transform: translateY(105%); transition: transform .3s cubic-bezier(.3,.7,.3,1);
    max-width: 760px; margin: 0 auto;
  }
  .sheet.open { transform: none; }
  .backdrop.open { opacity: 1; pointer-events: auto; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 14px; }
  .sheet-head { display: flex; gap: 16px; align-items: center; margin-bottom: 10px; }
  .sheet-head .card { --w: 128px; flex: none; cursor: default; }
  .sheet h2 { margin: 0; color: var(--gold); font-size: 21px; }
  .sheet .meta { color: var(--muted); font-size: 16px; }
  .sheet h4 { font: 600 12px 'Cinzel', serif; letter-spacing: .1em; color: var(--gold); text-transform: uppercase; margin: 16px 0 4px; }
  .sheet p { margin: 0; }
  .sheet .dim { opacity: .55; }

  /* Journal & deck */
  .journal { display: grid; gap: 12px; }
  .entry { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .entry summary { cursor: pointer; list-style: none; }
  .entry summary::-webkit-details-marker { display: none; }
  .entry .date { font: 600 11px 'Cinzel', serif; color: var(--gold); letter-spacing: .08em; }
  .entry .q { font-style: italic; margin: 2px 0; }
  .entry ul { padding-left: 18px; margin: 10px 0; }
  .entry .del { background: none; border: 0; color: var(--rev); font: 15px 'Cormorant Garamond', serif; cursor: pointer; padding: 0; }
  .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px 10px; }
  .deck-grid .tile { display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .deck-grid .card { --w: 100%; }
  .deck-section h3 { color: var(--gold); font-size: 15px; margin: 22px 0 10px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translate(-50%, 80px); background: var(--gold); color: #1a1430; font: 600 13px 'Cinzel', serif; padding: 10px 16px; border-radius: 999px; transition: transform .3s; z-index: 20; white-space: nowrap; }
  .toast.show { transform: translate(-50%, 0); }
  .foot { text-align: center; color: var(--muted); font-size: 14px; font-style: italic; margin-top: 36px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>✦ Tarot ✦</h1>
  <p class="subtitle">Sor, karıştır ve kartları dinle</p>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="read" aria-selected="true">Açılım</button>
    <button role="tab" data-tab="journal" aria-selected="false">Günlük</button>
    <button role="tab" data-tab="deck" aria-selected="false">Deste</button>
  </nav>

  <!-- AÇILIM -->
  <section id="read">
    <div id="setup" class="panel">
      <label class="h">Açılım türü</label>
      <div class="chips" id="spreadChips"></div>
      <div class="row">
        <div>
          <div class="cinzel" style="font-size:13px;color:var(--gold);letter-spacing:.08em">TERS KARTLAR</div>
          <div class="muted" style="font-size:16px">Kartlar baş aşağı gelebilir</div>
        </div>
        <label class="switch"><input type="checkbox" id="reversals" checked><span></span></label>
      </div>
      <button class="btn" id="drawBtn">Karıştır &amp; Çek</button>
    </div>

    <div id="shuffleView" hidden>
      <div class="deck-stack shuffling" id="deckStack"></div>
      <p class="center muted">Kartlar karıştırılıyor…</p>
    </div>

    <div id="readingView" hidden>
      <p class="question" id="rQuestion"></p>
      <h2 class="spread-title" id="rSpread"></h2>
      <p class="hint" id="rHint"></p>
      <div class="spread" id="spread"></div>
      <div class="readout" id="readout"></div>
      <div id="askAnswer"></div>
      <div id="askBox" class="panel ask" hidden>
        <label class="h" for="askQ">✨ Kartlara sor</label>
        <p class="muted note">Her açılımda bir soru hakkın var. Kartlar sorunu birlikte yorumlasın.</p>
        <div id="askForm">
          <textarea id="askQ" maxlength="300" placeholder="Kartlara ne sormak istersin?"></textarea>
          <p class="err" id="askErr" hidden></p>
          <button class="btn" id="askBtn">Sor</button>
        </div>
        <div id="askLoading" class="wind-scene" hidden>
          <svg viewBox="0 0 300 130" role="img" aria-label="Rüzgâra karşı yürüyen bir keşiş">
            <g class="gusts">
              <path class="gust" d="M0 22 q18 -5 36 0" style="animation-delay:-.2s"/>
              <path class="gust" d="M0 58 q24 -6 48 0" style="animation-delay:-1.1s;animation-duration:2.1s"/>
              <path class="gust" d="M0 88 q16 -4 32 0" style="animation-delay:-.7s;animation-duration:1.7s"/>
              <path class="gust" d="M0 40 q20 -5 40 0" style="animation-delay:-1.6s;animation-duration:2.3s"/>
            </g>
            <line class="ground" x1="0" y1="113" x2="300" y2="113"/>
            <g transform="translate(140 113) rotate(9) scale(1.3)">
              <g class="monk">
                <path class="cape" d="M-4 -44 C-16 -38 -24 -22 -30 -6 L-11 -2 Z"/>
                <ellipse class="foot foot-a" cx="-2" cy="-1" rx="4" ry="2"/>
                <ellipse class="foot foot-b" cx="7" cy="-1" rx="4" ry="2"/>
                <path class="robe" d="M-12 -1 L-5 -46 Q2 -54 9 -46 L14 -1 Z"/>
                <path class="robe" d="M-6 -44 Q-7 -63 4 -63 Q14 -61 12 -46 Q4 -51 -6 -44 Z"/>
                <ellipse class="face" cx="8" cy="-52" rx="3" ry="4.5"/>
                <path class="beard" d="M9 -48 q2 6 -2 11"/>
                <g class="staff">
                  <line class="pole" x1="23" y1="-70" x2="27" y2="0"/>
                  <line class="cord" x1="23" y1="-68" x2="29" y2="-63"/>
                  <circle class="glow" cx="29.5" cy="-58" r="7"/>
                  <rect class="lantern" x="27" y="-62" width="5" height="7" rx="1"/>
                </g>
                <path class="arm" d="M3 -38 Q12 -31 22 -35"/>
              </g>
            </g>
            <g transform="translate(0 20)"><g class="leaf l1"><path d="M-6 0 Q0 -5 6 0 Q0 5 -6 0Z"/><path class="vein" d="M-6 0 H6"/></g></g>
            <g transform="translate(0 46)"><g class="leaf l2"><path d="M-6 0 Q0 -5 6 0 Q0 5 -6 0Z"/><path class="vein" d="M-6 0 H6"/></g></g>
            <g transform="translate(0 72)"><g class="leaf l3"><path d="M-5 0 Q0 -4 5 0 Q0 4 -5 0Z"/><path class="vein" d="M-5 0 H5"/></g></g>
            <g transform="translate(0 32)"><g class="leaf l4"><path d="M-6 0 Q0 -5 6 0 Q0 5 -6 0Z"/><path class="vein" d="M-6 0 H6"/></g></g>
            <g transform="translate(0 92)"><g class="leaf l5"><path d="M-5 0 Q0 -4 5 0 Q0 4 -5 0Z"/><path class="vein" d="M-5 0 H5"/></g></g>

function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

function cardHTML(c, { rev = false, flipped = true, attrs = '', w = 480, lazy = false } = {}) {

  return `<button class="card${flipped ? ' flipped' : ''}${rev ? ' rev' : ''}" ${attrs} aria-label="${esc(c.name)}${rev ? ', ters' : ''}">

      <div class="face card-back">${BACK_SVG}</div>

    </div></button>`;
}

    .map(c => ({ id: c.id, rev: allowRev && randInt(2) === 1, flipped: false }));
  reading = { question: '', spreadId, allowRev, cards: drawn, date: Date.now(), saved: false };

  // Karıştırma sırasında görselleri önceden yükle
  drawn.forEach(d => { new Image().src = imgUrl(BY_ID[d.id], 480); });

  $('#setup').hidden = true; $('#shuffleView').hidden = false;
  setTimeout(() => { $('#shuffleView').hidden = true; renderReading(); }, 1600);
});

function renderReading() {
  const spread = SPREADS.find(s => s.id === reading.spreadId);
  $('#readingView').hidden = false;
  $('#rQuestion').textContent = reading.question ? `“${reading.question}”` : '';
  $('#rSpread').textContent = spread.name;
  const el = $('#spread');
  el.className = 'spread n' + spread.positions.length;
  el.innerHTML = reading.cards.map((d, i) => `
    <div class="slot" style="animation-delay:${i * 90}ms">
      ${cardHTML(BY_ID[d.id], { rev: d.rev, flipped: d.flipped, attrs: `data-i="${i}"` })}
      <div class="pos">${spread.positions.length > 3 ? `<span class="num">${i + 1}.</span> ` : ''}${esc(spread.positions[i][0])}</div>
      <div class="cname" id="cname${i}"></div>
    </div>`).join('');
  renderReadout();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reveal(i) {
  const d = reading.cards[i];
  if (d.flipped) return;
  d.flipped = true;
  $(`.card[data-i="${i}"]`).classList.add('flipped');
  $('#cname' + i).innerHTML = esc(BY_ID[d.id].name) + revTag(d.rev);
  renderReadout();
}

$('#spread').addEventListener('click', e => {
  const b = e.target.closest('.card'); if (!b) return;
  const i = +b.dataset.i, d = reading.cards[i];
  if (!d.flipped) reveal(i);
  else openSheet(BY_ID[d.id], d.rev, SPREADS.find(s => s.id === reading.spreadId).positions[i]);
});

$('#revealAll').addEventListener('click', () => {
  reading.cards.forEach((d, i) => setTimeout(() => reveal(i), i * 180));
});

$('#newReading').addEventListener('click', () => {
  $('#readingView').hidden = true; $('#setup').hidden = false; reading = null;
  $('#askAnswer').innerHTML = ''; $('#askBox').hidden = true; $('#askErr').hidden = true;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

function renderReadout() {
  const spread = SPREADS.find(s => s.id === reading.spreadId);
  const done = reading.cards.every(d => d.flipped);
  $('#rHint').textContent = done ? 'Ayrıntılı anlamı için bir karta dokun' : 'Açmak için kartlara dokun';
  $('#revealAll').hidden = done;
  $('#newReading').hidden = !done;

  let html = reading.cards.map((d, i) => {
    if (!d.flipped) return '';
    const c = BY_ID[d.id];
    return `<div class="reading-item" data-i="${i}">
      <h3>${esc(spread.positions[i][0])} <span class="muted" style="font-family:'Cormorant Garamond';font-size:15px;letter-spacing:0">· ${esc(spread.positions[i][1])}</span></h3>
      <div><span class="card-name">${esc(c.name)}</span>${revTag(d.rev)}</div>
      <div class="kw">${esc(d.rev ? c.rev : c.up)}</div>
    </div>`;
  }).join('');
  if (done && !reading.sections) reading.sections = interpretReading(reading.cards.map(d => ({ card: BY_ID[d.id], rev: d.rev })));
  if (done) html += summaryHTML(reading);
  $('#readout').innerHTML = html;
  if (done && !reading.ask && $('#askBox').hidden) {
    $('#askBox').hidden = false;
    $('#askQ').value = '';
  }

  if (done && !reading.saved) {
    reading.saved = true;
    const j = store.get();
    j.unshift({ question: reading.question, spreadId: reading.spreadId, date: reading.date, cards: reading.cards.map(({ id, rev }) => ({ id, rev })), sections: reading.sections });
    if (store.set(j.slice(0, 200))) toast('Günlüğüne kaydedildi');
  }
}

$('#readout').addEventListener('click', e => {
  const it = e.target.closest('.reading-item[data-i]'); if (!it) return;
  const i = +it.dataset.i, d = reading.cards[i];
  openSheet(BY_ID[d.id], d.rev, SPREADS.find(s => s.id === reading.spreadId).positions[i]);
});

function summaryHTML(r) {
  // Yorum açılım bitince bir kez üretilip saklanır; eski kayıtlar için sabit tohumla yeniden üretilir
  const sections = r.sections || interpretReading(r.cards.map(d => ({ card: BY_ID[d.id], rev: d.rev })), { seed: r.date });
  if (!sections) return '';
  return `<div class="reading-item summary"><h3>Kartlarının hikâyesi</h3>${sections.map(sec =>
    `<h4>${sec.title}</h4>${sec.items.map(t => `<p>${t}</p>`).join('')}`).join('')}</div>`;
}

/* ---------- Kartlara sor (Claude) ---------- */
const stripTags = s => s.replace(/<[^>]+>/g, '');
const paragraphs = text => text.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join('');
function answerHTML(ask) {
  return `<div class="reading-item summary answer"><h3>✨ Kartların cevabı</h3>
    <p class="q">“${esc(ask.q)}”</p>${paragraphs(ask.a)}</div>`;
}

$('#askBtn').addEventListener('click', async () => {
  const q = $('#askQ').value.trim();
  if (!q) { $('#askQ').focus(); return; }
  const spread = SPREADS.find(s => s.id === reading.spreadId);
  const sections = reading.sections || [];
  const payload = {
    question: q,
    spread: spread.name,
    cards: reading.cards.map((d, i) => {
      const c = BY_ID[d.id];
      return { position: spread.positions[i][0], name: c.name, reversed: d.rev, keywords: d.rev ? c.rev : c.up };
    }),
    summary: sections.map(sec => `${sec.title}:\n${sec.items.map(stripTags).join('\n')}`).join('\n\n'),
  };

  const btn = $('#askBtn'), current = reading;
  btn.disabled = true; $('#askErr').hidden = true;
  $('#askForm').hidden = true; $('#askLoading').hidden = false;
  $('#askBox').scrollIntoView({ behavior: 'smooth', block: 'center' });
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.answer) throw new Error(data.error || 'Şu an kartlara ulaşılamıyor.');
    if (reading !== current) return; // kullanıcı bu arada yeni açılıma geçti
    reading.ask = { q, a: data.answer };
    $('#askBox').hidden = true;
    $('#askAnswer').innerHTML = answerHTML(reading.ask);
    $('#askAnswer').scrollIntoView({ behavior: 'smooth', block: 'start' });
    const j = store.get(), entry = j.find(e => e.date === reading.date);
    if (entry) { entry.ask = reading.ask; store.set(j); }
  } catch (err) {
    // Hak harcanmaz; tekrar denenebilir
    $('#askErr').textContent = err.message === 'Failed to fetch' ? 'İnternet bağlantısını kontrol et.' : err.message;
    $('#askErr').hidden = false;
  } finally {
    btn.disabled = false;
    $('#askLoading').hidden = true; $('#askForm').hidden = false;
  }
});

/* ---------- Alt panel ---------- */
function openSheet(c, rev = false, position = null) {
  const meta = c.arcana === 'major'
    ? `Büyük Arkana · ${c.top}`
    : `${SUITS[c.suit].name} · ${SUITS[c.suit].element} · ${SUITS[c.suit].theme}`;
  $('#sheet').innerHTML = `<div class="grab"></div>
    <div class="sheet-head">${cardHTML(c, { rev, attrs: 'tabindex="-1"' })}
      <div><h2>${esc(c.name)}${rev ? ' <span class="tag-rev" style="font-family:Cormorant Garamond;font-size:18px">ters</span>' : ''}</h2>
      <div class="meta">${esc(meta)}</div></div></div>
    ${position ? `<h4>Pozisyon: ${esc(position[0])}</h4><p>${esc(position[1])}</p>` : ''}
    ${c.meaning ? `<h4>Anlamı</h4><p>${esc(c.meaning)}</p>` : ''}
    <h4>Düz</h4><p class="${rev ? 'dim' : ''}">${esc(c.up)}</p>
    <h4>Ters</h4><p class="${rev ? '' : 'dim'}">${esc(c.rev)}</p>`;
  $('#sheet').classList.add('open'); $('#backdrop').classList.add('open');
  $('#sheet').scrollTop = 0;
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); }
$('#backdrop').addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// Paneli aşağı kaydırarak kapat
let touchY = null;
$('#sheet').addEventListener('touchstart', e => { touchY = $('#sheet').scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
$('#sheet').addEventListener('touchend', e => { if (touchY !== null && e.changedTouches[0].clientY - touchY > 70) closeSheet(); touchY = null; });

/* ---------- Günlük ---------- */
function renderJournal() {
  const j = store.get(), el = $('#journalList');
  if (!j.length) { el.innerHTML = '<div class="panel center muted">Henüz açılım yok. Geçmiş açılımların burada görünecek.</div>'; return; }
  el.innerHTML = j.map((r, idx) => {
    const spread = SPREADS.find(s => s.id === r.spreadId);
    const date = new Date(r.date).toLocaleString('tr-TR', { dateStyle: 'medium', timeStyle: 'short' });
    return `<details class="entry"><summary>
        <div class="date">${esc(date.toLocaleUpperCase('tr-TR'))} · ${esc(spread.name.toLocaleUpperCase('tr-TR'))}</div>
        ${(r.question || r.ask?.q) ? `<div class="q">“${esc(r.question || r.ask.q)}”</div>` : ''}
        <div class="muted" style="font-size:16px">${r.cards.map(d => esc(BY_ID[d.id].name) + (d.rev ? ' ↺' : '')).join(' · ')}</div>
      </summary>
      <ul>${r.cards.map((d, i) => { const c = BY_ID[d.id]; return `<li><b>${esc(spread.positions[i][0])}:</b> ${esc(c.name)}${revTag(d.rev)} — <span class="kw">${esc(d.rev ? c.rev : c.up)}</span></li>`; }).join('')}</ul>
      ${summaryHTML(r)}
      ${r.ask ? answerHTML(r.ask) : ''}
      <button class="del" data-idx="${idx}">Bu açılımı sil</button>
    </details>`;
  }).join('');
}
$('#journalList').addEventListener('click', e => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('Bu açılım silinsin mi?')) return;
  const j = store.get(); j.splice(+b.dataset.idx, 1); store.set(j); renderJournal();
});

/* ---------- Deste ---------- */
function renderDeck() {
  if ($('#deck').dataset.ready) return;
  const groups = [['Büyük Arkana', DECK.filter(c => c.arcana === 'major')],
    ...Object.keys(SUITS).map(s => [`${SUITS[s].name} · ${SUITS[s].element}`, DECK.filter(c => c.suit === s)])];
  $('#deck').innerHTML = groups.map(([title, cards]) =>
    `<div class="deck-section"><h3>${title}</h3><div class="deck-grid">${cards.map(c =>
      `<div class="tile">${cardHTML(c, { attrs: `data-id="${c.id}"`, w: 240, lazy: true })}<div class="cname">${esc(c.name)}</div></div>`).join('')}</div></div>`).join('');
  $('#deck').dataset.ready = 1;
}
$('#deck').addEventListener('click', e => { const b = e.target.closest('.card'); if (b) openSheet(BY_ID[b.dataset.id]); });
</script>
</body>
